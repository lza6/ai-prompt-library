tools: [todo_write, call_expert, ask_expert, list_threads, retire_expert, skill_open, kb_search, kb_open, bb_query, bb_delete_asset, bb_delete_assets, bb_merge_assets, declare_intent, close_intent, reopen_intent, bb_delete_intent, bb_feature_tree_create, bb_feature_node, run_cmd, read_file, search_files, unpack_attachment, bb_add_artifact, bb_add_asset, bb_asset_status, bb_add_finding, bb_update_finding]
